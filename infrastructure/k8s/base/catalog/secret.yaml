# LOCAL-DEV-ONLY placeholder. Catalog.Api/Program.cs calls
# `builder.AddNpgsqlDbContext<CatalogDbContext>("catalogdb")` — Aspire's Npgsql EF Core
# integration binds the connection string from `ConnectionStrings:catalogdb` (the resource name
# passed to AddNpgsqlDbContext, not the plain service name), so the env var must be
# ConnectionStrings__catalogdb, not ConnectionStrings__catalog. The password must match
# postgres-credentials' CATALOG_DB_PASSWORD (infrastructure/k8s/base/postgres/secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__catalogdb: "Host=postgres;Port=5432;Database=catalog;Username=catalog_user;Password=local-dev-only-catalog-db-change-me"

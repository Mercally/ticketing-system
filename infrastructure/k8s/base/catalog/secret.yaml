# LOCAL-DEV-ONLY placeholder. ConnectionStrings__catalog is a guessed-but-reasonable env var name
# for EF Core's standard `builder.Configuration.GetConnectionString("catalog")` convention
# (`ConnectionStrings__<name>` -> `ConnectionStrings:<name>`) — Catalog.Api's actual DbContext
# registration code doesn't exist yet as of writing (parallel in-progress work), so confirm this
# name matches once it lands; adjust here if it uses a different key. The password must match
# postgres-credentials' CATALOG_DB_PASSWORD (infrastructure/k8s/base/postgres/secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__catalog: "Host=postgres;Port=5432;Database=catalog;Username=catalog_user;Password=local-dev-only-catalog-db-change-me"

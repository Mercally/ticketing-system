apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: ticketing
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  # See gateway/configmap.yaml for why Development is set deliberately (ServiceDefaults'
  # /health + /alive only map in IsDevelopment()), and for the OTEL_EXPORTER_OTLP_ENDPOINT note.

  # DECISIONS.md D17: API Gateway calls this service directly now (no YARP in front doing CORS).
  # Matches the S3 static-site origin hosting the frontend (infrastructure/aws-local).
  ALLOWED_ORIGINS: "http://ticketing-frontend-local.s3-website.localhost.localstack.cloud:4566"

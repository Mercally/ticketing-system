# LOCAL-DEV-ONLY placeholder. Same ConnectionStrings__<name> naming caveat as catalog/secret.yaml.
# Password must match postgres-credentials' ORDERS_DB_PASSWORD. JWT_SECRET must match
# auth-service/secret.yaml's value byte-for-byte (see that file's header comment).
apiVersion: v1
kind: Secret
metadata:
  name: orders-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__orders: "Host=postgres;Port=5432;Database=orders;Username=orders_user;Password=local-dev-only-orders-db-change-me"
  JWT_SECRET: "local-dev-only-jwt-secret-change-me"

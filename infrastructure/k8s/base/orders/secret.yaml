# LOCAL-DEV-ONLY placeholder. Orders.Api/Program.cs calls
# `builder.AddNpgsqlDbContext<OrdersDbContext>("ordersdb")`, so the connection-string env var must
# be ConnectionStrings__ordersdb — see catalog/secret.yaml for the naming rule. Password must
# match postgres-credentials' ORDERS_DB_PASSWORD. JWT_SECRET must match auth-service/secret.yaml's
# value byte-for-byte (see that file's header comment).
apiVersion: v1
kind: Secret
metadata:
  name: orders-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__ordersdb: "Host=postgres;Port=5432;Database=orders;Username=orders_user;Password=local-dev-only-orders-db-change-me"
  JWT_SECRET: "local-dev-only-jwt-secret-change-me"

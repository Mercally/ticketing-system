apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ticketing
  labels:
    app.kubernetes.io/name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      containers:
        - name: orders
          image: ticketing/orders:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
              name: http
          envFrom:
            - configMapRef:
                name: orders-config
            - secretRef:
                name: orders-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 20

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: ticketing
  labels:
    app.kubernetes.io/name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      containers:
        - name: payments
          image: ticketing/payments:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
              name: http
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 20

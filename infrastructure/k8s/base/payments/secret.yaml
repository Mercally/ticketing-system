# LOCAL-DEV-ONLY placeholder. Payments.Api/Program.cs calls
# `builder.AddNpgsqlDbContext<PaymentsDbContext>("paymentsdb")`, so the connection-string env var
# must be ConnectionStrings__paymentsdb — see catalog/secret.yaml for the naming rule. Password
# must match postgres-credentials' PAYMENTS_DB_PASSWORD. No JWT_SECRET here: Payment Service's
# only HTTP surface is GET /{orderId} (status) and the internal /webhook called by the Fake
# Payment Gateway directly (docs/CONTRACTS.md §7) — not proxied through Gateway's auth-checked
# routes, so it has no reason to validate buyer JWTs itself in this design.
apiVersion: v1
kind: Secret
metadata:
  name: payments-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__paymentsdb: "Host=postgres;Port=5432;Database=payments;Username=payments_user;Password=local-dev-only-payments-db-change-me"

# LocalStack stands in for AWS SQS/SNS locally (DECISIONS.md D4) — MassTransit's AWS transport
# points at this endpoint in Development, and the real Terraform-provisioned SQS/SNS (in
# infrastructure/terraform/modules/sqs_sns) is what the same code path targets in AWS. No
# persistence beyond the pod's lifetime — this is throwaway state for local validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: ticketing
  labels:
    app.kubernetes.io/name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: "sqs,sns"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: PERSISTENCE
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 20
            periodSeconds: 20

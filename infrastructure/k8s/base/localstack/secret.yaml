# LOCAL-DEV-ONLY placeholder, never a real secret checked into git.
#
# LocalStack (as of the version pulled by `localstack/localstack:latest` at deploy time) refuses
# to start at all without a LOCALSTACK_AUTH_TOKEN — even for community/free-tier services like
# SQS/SNS, which this platform actually uses. This is a LocalStack account requirement, not
# something this repo can work around: sign up for a free account at https://app.localstack.cloud,
# copy the auth token from your account page (or run `localstack auth set-token` if you have the
# CLI), and replace the placeholder below before applying.
#
# See infrastructure/LOCAL_AWS_SIMULATION.md for the full explanation and DECISIONS.md D16.
apiVersion: v1
kind: Secret
metadata:
  name: localstack-secrets
  namespace: ticketing
type: Opaque
stringData:
  LOCALSTACK_AUTH_TOKEN: "replace-with-your-free-localstack-auth-token"

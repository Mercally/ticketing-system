# LOCAL-DEV-ONLY placeholder values, never real secrets.
#
# DATABASE_URL assumes Prisma's standard connection-string env var name and the "notification"
# database + "notification_user" role created by
# infrastructure/k8s/base/postgres/configmap-init.yaml. The password here MUST match
# postgres-credentials' NOTIFICATION_DB_PASSWORD (infrastructure/k8s/base/postgres/secret.yaml)
# — they're not cross-referenced automatically by Kustomize, so keep them in sync by hand if
# either changes. Backs the inbox pattern's ProcessedMessage table (see prisma/schema.prisma) —
# LocalStack creds stay in configmap.yaml since they're dummy test values, not sensitive.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: ticketing
type: Opaque
stringData:
  DATABASE_URL: "postgresql://notification_user:local-dev-only-notification-db-change-me@postgres:5432/notification?schema=public"

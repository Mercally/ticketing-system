# LOCAL-DEV-ONLY placeholder credentials. Never real secrets — for a local kind/minikube
# PoC these are committed in plaintext for convenience. In infrastructure/terraform, the real
# AWS target uses five independent RDS instances with credentials in Secrets Manager
# (see terraform/modules/secrets and terraform/modules/rds).
#
# Per DECISIONS.md D5: one Postgres StatefulSet, six databases (auth, catalog, ticketing,
# orders, payments, notification), each with its OWN role/password for real isolation even
# though they share one instance locally — a service's credentials only ever grant access to
# its own database.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ticketing
type: Opaque
stringData:
  # Superuser, used only by the postgres image itself / the init script to create the five
  # per-service roles+databases below. No application service is ever given this password.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: local-dev-only-postgres-superuser-change-me

  # One role + password per service database. Referenced both by the init script
  # (infrastructure/k8s/base/postgres/configmap-init.yaml) and duplicated into each
  # service's own secret.yaml as the password half of its ConnectionStrings__<db> value.
  AUTH_DB_PASSWORD: local-dev-only-auth-db-change-me
  CATALOG_DB_PASSWORD: local-dev-only-catalog-db-change-me
  TICKETING_DB_PASSWORD: local-dev-only-ticketing-db-change-me
  ORDERS_DB_PASSWORD: local-dev-only-orders-db-change-me
  PAYMENTS_DB_PASSWORD: local-dev-only-payments-db-change-me
  NOTIFICATION_DB_PASSWORD: local-dev-only-notification-db-change-me

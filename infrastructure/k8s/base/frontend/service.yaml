# NodePort, same rationale as gateway/service.yaml — see infrastructure/k8s/README.md. Fixed
# nodePort 30173 (mnemonic: Vite's dev-server port is 5173) so the browser URL is predictable
# without looking it up after every `kubectl apply`.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticketing
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30173

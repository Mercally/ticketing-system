# LOCAL-DEV-ONLY placeholder values, never real secrets.
#
# DATABASE_URL assumes Prisma's standard connection-string env var name and the "auth" database +
# "auth_user" role created by infrastructure/k8s/base/postgres/configmap-init.yaml. The password
# here MUST match postgres-credentials' AUTH_DB_PASSWORD (infrastructure/k8s/base/postgres/secret.yaml)
# — they're not cross-referenced automatically by Kustomize, so keep them in sync by hand if either
# changes.
#
# JWT_SECRET is HS256, shared with the services that validate tokens Auth Service issues
# (per docs/CONTRACTS.md §3/§4 and ARCHITECTURE.md's note that RS256+rotated keys is the
# production upgrade). It is duplicated as a literal into every secret.yaml that needs it
# (this file, ticketing, orders) because this k8s scaffold has no shared-secret store wired up —
# infrastructure/terraform/modules/secrets is where that gets centralized for the AWS target.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: ticketing
type: Opaque
stringData:
  DATABASE_URL: "postgresql://auth_user:local-dev-only-auth-db-change-me@postgres:5432/auth?schema=public"
  JWT_SECRET: "local-dev-only-jwt-secret-change-me"

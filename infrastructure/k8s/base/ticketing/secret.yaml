# LOCAL-DEV-ONLY placeholder. See catalog/secret.yaml for the ConnectionStrings__<name> naming
# caveat (best-guess convention, unverified against Ticketing.Infrastructure's actual DbContext
# registration, which doesn't exist yet as of writing). Password must match postgres-credentials'
# TICKETING_DB_PASSWORD. JWT_SECRET must match auth-service/secret.yaml's value byte-for-byte —
# see that file's header comment for why it's duplicated rather than shared.
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__ticketing: "Host=postgres;Port=5432;Database=ticketing;Username=ticketing_user;Password=local-dev-only-ticketing-db-change-me"
  JWT_SECRET: "local-dev-only-jwt-secret-change-me"

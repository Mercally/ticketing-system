# LOCAL-DEV-ONLY placeholder. Ticketing.Api/Program.cs calls
# `builder.AddNpgsqlDbContext<TicketingDbContext>("ticketingdb")`, so the connection-string env
# var must be ConnectionStrings__ticketingdb — see catalog/secret.yaml for why the resource name
# (not the plain service name) is what Aspire's Npgsql EF Core integration binds from. Password
# must match postgres-credentials' TICKETING_DB_PASSWORD. JWT_SECRET must match
# auth-service/secret.yaml's value byte-for-byte — see that file's header comment for why it's
# duplicated rather than shared.
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secrets
  namespace: ticketing
type: Opaque
stringData:
  ConnectionStrings__ticketingdb: "Host=postgres;Port=5432;Database=ticketing;Username=ticketing_user;Password=local-dev-only-ticketing-db-change-me"
  JWT_SECRET: "local-dev-only-jwt-secret-change-me"

# Redis, scoped STRICTLY to Gateway waiting-room admission counters + rate-limit state
# (DECISIONS.md D11 / ARCHITECTURE.md §9). Never used as seat-availability authority — that is
# Ticketing's Postgres CAS UPDATE, exclusively (ADR-0002). No other service should be wired to
# this Deployment; if you find yourself adding a ConnectionStrings-style env var pointing another
# service at "redis", that's very likely a correctness bug per the prompt's explicit requirement
# ("NO utilices Redis como autoridad para garantizar exclusividad del asiento").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticketing
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakepaymentgateway
  namespace: ticketing
  labels:
    app.kubernetes.io/name: fakepaymentgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fakepaymentgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fakepaymentgateway
    spec:
      containers:
        - name: fakepaymentgateway
          image: ticketing/fakepaymentgateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
              name: http
          envFrom:
            - configMapRef:
                name: fakepaymentgateway-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 20

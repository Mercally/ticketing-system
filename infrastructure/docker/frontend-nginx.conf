# Minimal SPA server: every non-file route falls back to index.html so React Router's
# client-side routes (login, event browse, seat map, checkout, order status) work on
# hard refresh / direct navigation, not just client-side transitions.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: served as-is, with far-future caching (Vite fingerprints filenames).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: anything else that isn't a real file resolves to index.html so the
    # frontend's own router decides what to render (and so a hard-refresh on e.g.
    # /events/123 doesn't 404 at the web server).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening; not a substitute for the WAF/edge layer described in
    # ARCHITECTURE.md §10.5 — this is a local dev/demo static file server only.
    server_tokens off;
}
